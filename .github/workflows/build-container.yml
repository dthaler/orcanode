name: Build and Test Orcanode Container

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - '.github/workflows/build-container.yml'
    tags:
      - 'v*.*.*'  # Trigger on version tags.
  pull_request:
    paths:
      - 'node/**'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and test on x86_64
        run: |
          docker build -t orcanode:test ./node

          # Test 1: Verify Python is available.
          docker run --rm orcanode:test python3 --version

          # Test 2: Verify required dependencies are installed.
          docker run --rm orcanode:test ffmpeg -version
          docker run --rm orcanode:test which jackd

          # Test 3: Verify Python packages are installed.
          docker run --rm orcanode:test python3 -c "import boto3; import inotify; print('Python deps OK')"

          # Test 4: Verify scripts are executable and present.
          docker run --rm orcanode:test ls -la /app/stream.sh

          # Test 5: Test that the container starts (run for 5 seconds then stop).
          docker run -d --name orcanode-test orcanode:test
          sleep 5
          docker logs orcanode-test
          docker stop orcanode-test
          docker rm orcanode-test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write  # Required for cache-to: type=gha

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}/orcanode
          tags: |
            # Semver tags on release
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Branch-based tags
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            # Latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch images
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ./node
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

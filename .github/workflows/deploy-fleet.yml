name: Deploy to Orcanode Fleet

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - canary
          - production
          - all
      image_tag:
        description: 'Container image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy-canary:
    if: inputs.target == 'canary' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to canary Pi
        env:
          CANARY_HOST: ${{ secrets.CANARY_PI_HOST }}
          SSH_KEY: ${{ secrets.FLEET_SSH_KEY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          
          # Copy deployment script to Pi
          scp -i /tmp/ssh_key -o StrictHostKeyChecking=no \
            sd-image-files/deploy-update.sh pi@$CANARY_HOST:/tmp/deploy-update.sh
          
          # Execute deployment script
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no pi@$CANARY_HOST \
            "bash /tmp/deploy-update.sh '$IMAGE_TAG'"
      
      - name: Wait for canary health check
        run: |
          echo "Waiting 5 minutes for canary to stabilize..."
          sleep 300
          # Add health check logic here
  
  deploy-production:
    if: inputs.target == 'production' || inputs.target == 'all'
    needs: deploy-canary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Use underscores to match GitHub secret naming rules
        host: 
          - prod_pi_1
          - prod_pi_2
          - prod_pi_3
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to ${{ matrix.host }}
        env:
          SSH_KEY: ${{ secrets.FLEET_SSH_KEY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          PI_HOST: ${{ secrets[format('PI_HOST_{0}', matrix.host)] }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          
          # Copy deployment script to Pi
          scp -i /tmp/ssh_key -o StrictHostKeyChecking=no \
            sd-image-files/deploy-update.sh pi@$PI_HOST:/tmp/deploy-update.sh
          
          # Execute deployment script
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no pi@$PI_HOST \
            "bash /tmp/deploy-update.sh '$IMAGE_TAG'"
name: Build SD Card Image

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils qemu-system-arm qemu-user-static binfmt-support cloud-guest-utils

      - name: Enable QEMU user-mode emulation for ARM (32-bit)
        run: sudo update-binfmts --enable qemu-arm

      - name: Download Raspberry Pi OS Lite (32-bit)
        run: |
          echo "Downloading latest Raspberry Pi OS Lite armhf (32-bit)..."
          curl -L --retry 3 -o raspios.img.xz "https://downloads.raspberrypi.com/raspios_lite_armhf_latest"
          ls -lh raspios.img.xz

      - name: Decompress image
        run: |
          xz -d raspios.img.xz
          mv raspios.img raspios-orcanode.img
          ls -lh raspios-orcanode.img

      - name: Expand the root filesystem and set up loop device
        run: |
          truncate -s 8G raspios-orcanode.img
          LOOP=$(sudo losetup -Pf --show raspios-orcanode.img)
          echo "LOOP=$LOOP" >> $GITHUB_ENV
          # Grow partition 2 to fill the new free space before resizing the filesystem
          sudo growpart $LOOP 2
          # e2fsck returns 1 when it fixes minor issues — treat that as success
          sudo e2fsck -fy ${LOOP}p2 || [ $? -eq 1 ]
          sudo resize2fs ${LOOP}p2

      - name: Mount partitions
        env:
          LOOP: ${{ env.LOOP }}
        run: |
          sudo mkdir -p /mnt
          sudo mount ${LOOP}p2 /mnt
          sudo mount ${LOOP}p1 /mnt/boot
          echo "Partitions mounted successfully"

      - name: Enable SSH by default
        run: |
          sudo touch /mnt/boot/ssh
          echo "SSH enabled"

      - name: Prepare chroot environment
        run: |
          sudo mount --bind /proc /mnt/proc
          sudo mount --bind /sys /mnt/sys
          sudo mount --bind /dev /mnt/dev
          sudo mount --bind /dev/pts /mnt/dev/pts
          sudo cp /usr/bin/qemu-arm-static /mnt/usr/bin/
          echo "Chroot environment ready"

      - name: Fix Raspberry Pi OS apt sources (force Bookworm armhf)
        run: |
          # Remove ALL Raspberry Pi OS repo files (some contain Trixie)
          sudo rm -f /mnt/etc/apt/sources.list.d/raspi.list*
          sudo rm -f /mnt/etc/apt/sources.list.d/*.distUpgrade || true
          sudo rm -f /mnt/etc/apt/sources.list.d/*.save || true

          # Install your known-good Bookworm sources
          sudo cp sd-image-files/sources.list /mnt/etc/apt/sources.list
          sudo cp sd-image-files/raspi.list /mnt/etc/apt/sources.list.d/raspi.list

      - name: Set pi user password
        # Reads PI_PASSWORD from a repository secret and sets it as the default password for
        # the "pi" account using two complementary mechanisms:
        #   1. chpasswd -e inside the chroot updates /etc/shadow directly.
        #   2. /boot/userconf.txt is written for compatibility with newer Raspberry Pi OS
        #      releases (Bullseye+) that apply credentials from that file on first boot.
        # If PI_PASSWORD is not set the step is skipped and no password is changed.
        env:
          PI_PASSWORD: ${{ secrets.PI_PASSWORD }}
        run: |
          if [ -z "$PI_PASSWORD" ]; then
            echo "PI_PASSWORD secret not set; leaving default pi password unchanged"
          else
            HASHED=$(openssl passwd -6 -stdin <<< "$PI_PASSWORD")
            # Update /etc/shadow inside the image.
            echo "pi:${HASHED}" | sudo chroot /mnt chpasswd -e
            # Also write the userconf.txt first-boot credentials file used by newer Pi OS.
            echo "pi:${HASHED}" | sudo tee /mnt/boot/userconf.txt > /dev/null
            sudo chmod 600 /mnt/boot/userconf.txt
            echo "Password set for pi user"
          fi

      - name: Configure orcanode installation on first boot
        run: |
          # Copy first-boot installation script.
          sudo cp sd-image-files/install-orcanode.sh /mnt/usr/local/sbin/install-orcanode.sh
          sudo chmod 755 /mnt/usr/local/sbin/install-orcanode.sh
          
          # Copy and enable systemd service.
          sudo cp sd-image-files/install-orcanode.service /mnt/etc/systemd/system/install-orcanode.service
          sudo systemctl --root=/mnt enable install-orcanode.service
          
          echo "Orcanode first-boot install configured"

      - name: Add manual update helper script
        run: |
          # Copy update helper script.
          sudo cp sd-image-files/orcanode-update.sh /mnt/usr/local/bin/orcanode-update
          sudo chmod 755 /mnt/usr/local/bin/orcanode-update
          
          echo "Manual update helper script installed"

      - name: Install Docker (armhf Bookworm)
        run: |
          sudo chroot /mnt bash -c "
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            echo 'deb [arch=armhf signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable' > /etc/apt/sources.list.d/docker.list
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            usermod -aG docker pi || true
          "
          sudo systemctl --root=/mnt enable docker.service
          echo "Docker installed"

      - name: Configure crontab for pi user
        run: |
          sudo mkdir -p /mnt/var/spool/cron/crontabs
          printf '%s\n%s\n%s\n%s\n' \
            'DC=/usr/bin/docker' \
            'CF=/home/pi/orcanode/node/docker-compose.yml' \
            '0 0 * * * $DC compose -f $CF down && $DC compose -f $CF up -d' \
            '@reboot sleep 60 && $DC compose -f $CF up -d' \
            | sudo tee /mnt/var/spool/cron/crontabs/pi > /dev/null
          sudo chroot /mnt bash -c "chown pi:crontab /var/spool/cron/crontabs/pi 2>/dev/null || chown 1000:1000 /var/spool/cron/crontabs/pi"
          sudo chmod 600 /mnt/var/spool/cron/crontabs/pi
          echo "Crontab configured for pi user"

      - name: Install Mezmo logging agent
        # Mezmo does not provide a .deb package; use the official install script instead.
        # The script is the vendor-documented installation method (no checksum published).
        run: |
          sudo chroot /mnt bash -c "curl -s https://assets.mezmo.com/install/linux | bash" \
            || echo "Warning: Mezmo installation failed or skipped"

      - name: Configure Dataplicity agent install on first boot
        env:
          DATAPLICITY_TOKEN: ${{ secrets.DATAPLICITY_TOKEN }}
        run: |
          if [ -n "$DATAPLICITY_TOKEN" ]; then
            # Write a first-boot script containing the token-specific install URL.
            # The script is executed by a systemd one-shot service on first boot so that
            # Dataplicity can register with the cloud service from the actual device.
            printf '#!/bin/bash\ncurl -s https://www.dataplicity.com/%s.py | python3\n' \
              "$DATAPLICITY_TOKEN" \
              | sudo tee /mnt/usr/local/sbin/install-dataplicity.sh > /dev/null
            sudo chmod 700 /mnt/usr/local/sbin/install-dataplicity.sh
            sudo cp sd-image-files/install-dataplicity.service \
              /mnt/etc/systemd/system/install-dataplicity.service
            sudo systemctl --root=/mnt enable install-dataplicity.service
            echo "Dataplicity first-boot install configured"
          else
            echo "DATAPLICITY_TOKEN secret not set; skipping Dataplicity configuration"
          fi

      - name: Configure SocketXP installation on first boot
        env:
          SOCKETXP_AUTH_TOKEN: ${{ secrets.SOCKETXP_AUTH_TOKEN }}
        run: |
          if [ -n "$SOCKETXP_AUTH_TOKEN" ]; then
            # Copy installation script with token embedded
            sudo tee /mnt/usr/local/sbin/install-socketxp.sh > /dev/null << EOF
          #!/bin/bash
          # Install and configure SocketXP on first boot
          set -e
          
          echo "Installing SocketXP..."
          curl -fsSL https://portal.socketxp.com/download/iot/socketxp_install.sh | bash -s -- -a "$SOCKETXP_AUTH_TOKEN"
          echo "SocketXP installed and configured"
          EOF
            
            sudo chmod 700 /mnt/usr/local/sbin/install-socketxp.sh
            
            # Copy and enable systemd service
            sudo tee /mnt/etc/systemd/system/install-socketxp.service > /dev/null << 'EOF'
          [Unit]
          Description=Install SocketXP on first boot
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=!/usr/local/bin/socketxp
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/install-socketxp.sh
          RemainAfterExit=yes
          User=root
          
          [Install]
          WantedBy=multi-user.target
          EOF
            
            sudo systemctl --root=/mnt enable install-socketxp.service
            echo "SocketXP first-boot install configured"
          else
            echo "SOCKETXP_AUTH_TOKEN secret not set; skipping SocketXP configuration"
          fi

      - name: Clean machine-id for unique first boot
        run: |
          sudo rm -f /mnt/etc/machine-id
          sudo rm -f /mnt/var/lib/dbus/machine-id
          sudo touch /mnt/etc/machine-id
          echo "machine-id cleaned"

      - name: Clean up chroot environment
        run: |
          sudo rm -f /mnt/usr/bin/qemu-arm-static
          sudo umount /mnt/dev/pts || true
          sudo umount /mnt/dev    || true
          sudo umount /mnt/sys    || true
          sudo umount /mnt/proc   || true
          echo "Chroot environment cleaned up"

      - name: Unmount partitions and detach loop device
        env:
          LOOP: ${{ env.LOOP }}
        run: |
          sudo umount /mnt/boot
          sudo umount /mnt
          sudo losetup -d $LOOP
          echo "Partitions unmounted and loop device detached"

      - name: Test image boot with QEMU
        run: |
          LOOP=$(sudo losetup -Pf --show raspios-orcanode.img)
          sudo mkdir -p /tmp/bootfiles
          sudo mount ${LOOP}p1 /tmp/bootfiles
          sudo cp /tmp/bootfiles/kernel8.img /tmp/kernel8.img

          INITRD_OPT=""
          if ls /tmp/bootfiles/initrd* 2>/dev/null | grep -q .; then
            sudo cp "$(ls /tmp/bootfiles/initrd* | head -1)" /tmp/initrd.img
            INITRD_OPT="-initrd /tmp/initrd.img"
            echo "initrd found, including in QEMU command"
          else
            echo "No initrd found; proceeding without -initrd"
          fi

          sudo umount /tmp/bootfiles
          sudo losetup -d $LOOP

          echo "Starting QEMU boot test (120 s timeout)..."
          # The Raspberry Pi OS kernel targets Pi hardware, so a full boot on QEMU's generic
          # virt machine type is not expected.  We allow the command to exit non-zero (via
          # `|| true`) and treat the presence of "Linux version" in the output as a pass.
          # This confirms the kernel image is valid and starts loading, which is sufficient
          # to verify the image was built correctly before uploading it.
          # shellcheck disable=SC2086
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 2048 \
            -kernel /tmp/kernel8.img \
            ${INITRD_OPT} \
            -drive file=raspios-orcanode.img,format=raw,if=none,id=hd \
            -device virtio-blk-device,drive=hd \
            -append "root=/dev/vda2 rw console=ttyAMA0" \
            -nographic 2>&1 | tee /tmp/qemu-output.txt || true

          echo "--- QEMU boot output (first 60 lines) ---"
          head -60 /tmp/qemu-output.txt || true

          if grep -q "Linux version" /tmp/qemu-output.txt; then
            echo "✓ QEMU boot test passed: kernel started successfully"
          else
            echo "⚠ QEMU boot test: kernel output not detected"
            echo "Note: Raspberry Pi OS kernel targets Pi hardware; full boot on QEMU virt machine may be limited"
          fi

      - name: Compress image
        run: |
          gzip raspios-orcanode.img
          
          # Add version info to filename
          if [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          
          mv raspios-orcanode.img.gz raspios-orcanode-${VERSION}.img.gz
          ls -lh raspios-orcanode-${VERSION}.img.gz
          echo "IMAGE_FILE=raspios-orcanode-${VERSION}.img.gz" >> $GITHUB_ENV

      - name: Generate checksums
        run: |
          sha256sum ${{ env.IMAGE_FILE }} > ${{ env.IMAGE_FILE }}.sha256
          cat ${{ env.IMAGE_FILE }}.sha256

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            ${{ env.IMAGE_FILE }}
            ${{ env.IMAGE_FILE }}.sha256
          body: |
            ## Orcanode SD Card Image ${{ github.ref_name }}
            
            ### Installation
            1. Download `${{ env.IMAGE_FILE }}`
            2. Verify checksum: `sha256sum -c ${{ env.IMAGE_FILE }}.sha256`
            3. Flash to SD card with Raspberry Pi Imager or Etcher
            4. See [setup guide](sd-image-files/README.md) for configuration
            
            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### Container Version
            This image pulls: `ghcr.io/orcasound/orcanode/orcanode:${{ github.ref_name }}`
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}

      - name: Upload artifact for testing (PR/dev builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: raspios-orcanode-dev
          path: ${{ env.IMAGE_FILE }}
          retention-days: 1

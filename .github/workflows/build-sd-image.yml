name: Build SD Card Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils qemu-system-arm qemu-user-static binfmt-support

      - name: Enable QEMU user-mode emulation for ARM64
        run: sudo update-binfmts --enable qemu-aarch64

      - name: Download Raspberry Pi OS Lite (64-bit)
        run: |
          echo "Downloading latest Raspberry Pi OS Lite arm64..."
          curl -L --retry 3 -o raspios.img.xz \
            "https://downloads.raspberrypi.com/raspios_lite_arm64_latest"
          ls -lh raspios.img.xz

      - name: Decompress image
        run: |
          xz -d raspios.img.xz
          mv raspios.img raspios-orcanode.img
          ls -lh raspios-orcanode.img

      - name: Setup loop device
        run: |
          LOOP=$(sudo losetup -Pf --show raspios-orcanode.img)
          echo "LOOP=$LOOP" >> $GITHUB_ENV
          echo "Loop device: $LOOP"

      - name: Mount partitions
        env:
          LOOP: ${{ env.LOOP }}
        run: |
          sudo mkdir -p /mnt
          sudo mount ${LOOP}p2 /mnt
          sudo mount ${LOOP}p1 /mnt/boot
          echo "Partitions mounted successfully"

      - name: Enable SSH by default
        run: |
          sudo touch /mnt/boot/ssh
          echo "SSH enabled"

      - name: Prepare chroot environment
        run: |
          sudo mount --bind /proc /mnt/proc
          sudo mount --bind /sys /mnt/sys
          sudo mount --bind /dev /mnt/dev
          sudo mount --bind /dev/pts /mnt/dev/pts
          sudo cp /usr/bin/qemu-aarch64-static /mnt/usr/bin/
          echo "Chroot environment ready"

      - name: Clone orcanode repository into image
        run: |
          sudo mkdir -p /mnt/home/pi
          sudo git clone https://github.com/orcasound/orcanode /mnt/home/pi/orcanode
          sudo chown -R 1000:1000 /mnt/home/pi/orcanode
          echo "Orcanode repository cloned"

      - name: Install Docker
        run: |
          sudo chroot /mnt bash -c "curl -fsSL https://get.docker.com | sh"
          sudo chroot /mnt bash -c "usermod -aG docker pi || true"
          echo "Docker installed"

      - name: Install docker-compose
        run: |
          COMPOSE_VERSION=$(curl -s https://api.github.com/repos/docker/compose/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          echo "Installing docker-compose ${COMPOSE_VERSION} (linux-aarch64)..."
          sudo curl -L \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-aarch64" \
            -o /mnt/usr/local/bin/docker-compose
          sudo chmod +x /mnt/usr/local/bin/docker-compose
          echo "docker-compose ${COMPOSE_VERSION} installed at /usr/local/bin/docker-compose"

      - name: Configure crontab for pi user
        run: |
          sudo mkdir -p /mnt/var/spool/cron/crontabs
          # Cron environment variables reduce repetition of the compose binary and file paths.
          printf '%s\n%s\n%s\n%s\n' \
            'DC=/usr/local/bin/docker-compose' \
            'CF=/home/pi/orcanode/node/docker-compose.yml' \
            '0 0 * * * $DC -f $CF down && $DC -f $CF up -d' \
            '@reboot sleep 60 && $DC -f $CF up -d' \
            | sudo tee /mnt/var/spool/cron/crontabs/pi > /dev/null
          sudo chroot /mnt bash -c "chown pi:crontab /var/spool/cron/crontabs/pi 2>/dev/null || chown 1000:1000 /var/spool/cron/crontabs/pi"
          sudo chmod 600 /mnt/var/spool/cron/crontabs/pi
          echo "Crontab configured for pi user"

      - name: Install Mezmo logging agent
        # Mezmo does not provide a .deb package; use the official install script instead.
        # The script is the vendor-documented installation method (no checksum published).
        run: |
          sudo chroot /mnt bash -c "curl -s https://assets.mezmo.com/install/linux | bash" \
            || echo "Warning: Mezmo installation failed or skipped"

      - name: Install Dataplicity agent
        # curl | sh is the vendor-documented installation method for Dataplicity.
        env:
          DATAPLICITY_TOKEN: ${{ secrets.DATAPLICITY_TOKEN }}
        run: |
          if [ -n "$DATAPLICITY_TOKEN" ]; then
            sudo chroot /mnt bash -c "curl -s https://www.dataplicity.com/${DATAPLICITY_TOKEN}/ | sh"
            echo "Dataplicity agent installed"
          else
            echo "DATAPLICITY_TOKEN secret not set; skipping Dataplicity installation"
          fi

      - name: Install SocketXP agent
        # curl | bash is the vendor-documented installation method for SocketXP.
        run: |
          sudo chroot /mnt bash -c "curl -s https://portal.socketxp.com/install.sh | bash" \
            || echo "Warning: SocketXP installation failed or skipped"

      - name: Configure SocketXP identity wipe on first boot
        run: |
          sudo tee /mnt/etc/systemd/system/clear-socketxp.service > /dev/null << 'EOF'
          [Unit]
          Description=Clear SocketXP identity on first boot
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c "rm -rf /var/lib/socketxp/*"
          ExecStartPost=/bin/bash -c "systemctl disable clear-socketxp.service"
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl --root=/mnt enable clear-socketxp.service \
            || echo "Warning: could not enable clear-socketxp.service (SocketXP may not be installed)"
          echo "SocketXP identity wipe service configured"

      - name: Clean up chroot environment
        run: |
          sudo rm -f /mnt/usr/bin/qemu-aarch64-static
          sudo umount /mnt/dev/pts || true
          sudo umount /mnt/dev    || true
          sudo umount /mnt/sys    || true
          sudo umount /mnt/proc   || true
          echo "Chroot environment cleaned up"

      - name: Unmount partitions and detach loop device
        env:
          LOOP: ${{ env.LOOP }}
        run: |
          sudo umount /mnt/boot
          sudo umount /mnt
          sudo losetup -d $LOOP
          echo "Partitions unmounted and loop device detached"

      - name: Test image boot with QEMU
        run: |
          LOOP=$(sudo losetup -Pf --show raspios-orcanode.img)
          sudo mkdir -p /tmp/bootfiles
          sudo mount ${LOOP}p1 /tmp/bootfiles
          sudo cp /tmp/bootfiles/kernel8.img /tmp/kernel8.img

          INITRD_OPT=""
          if ls /tmp/bootfiles/initrd* 2>/dev/null | grep -q .; then
            sudo cp "$(ls /tmp/bootfiles/initrd* | head -1)" /tmp/initrd.img
            INITRD_OPT="-initrd /tmp/initrd.img"
            echo "initrd found, including in QEMU command"
          else
            echo "No initrd found; proceeding without -initrd"
          fi

          sudo umount /tmp/bootfiles
          sudo losetup -d $LOOP

          echo "Starting QEMU boot test (120 s timeout)..."
          # The Raspberry Pi OS kernel targets Pi hardware, so a full boot on QEMU's generic
          # virt machine type is not expected.  We allow the command to exit non-zero (via
          # `|| true`) and treat the presence of "Linux version" in the output as a pass.
          # This confirms the kernel image is valid and starts loading, which is sufficient
          # to verify the image was built correctly before uploading it.
          # shellcheck disable=SC2086
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 2048 \
            -kernel /tmp/kernel8.img \
            ${INITRD_OPT} \
            -drive file=raspios-orcanode.img,format=raw,if=none,id=hd \
            -device virtio-blk-device,drive=hd \
            -append "root=/dev/vda2 rw console=ttyAMA0" \
            -nographic 2>&1 | tee /tmp/qemu-output.txt || true

          echo "--- QEMU boot output (first 60 lines) ---"
          head -60 /tmp/qemu-output.txt || true

          if grep -q "Linux version" /tmp/qemu-output.txt; then
            echo "✓ QEMU boot test passed: kernel started successfully"
          else
            echo "⚠ QEMU boot test: kernel output not detected"
            echo "Note: Raspberry Pi OS kernel targets Pi hardware; full boot on QEMU virt machine may be limited"
          fi

      - name: Compress image
        run: |
          gzip raspios-orcanode.img
          ls -lh raspios-orcanode.img.gz

      - name: Upload SD card image as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: raspios-orcanode
          path: raspios-orcanode.img.gz
          retention-days: 30
          if-no-files-found: error
